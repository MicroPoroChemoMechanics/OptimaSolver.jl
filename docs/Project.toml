[deps]
Documenter = "e30172f5-a6a5-5a46-863b-614d45cd2de4"
ForwardDiff = "f6369f11-7733-5829-9624-2563aa707210"
OptimaSolver = "24efeca9-a785-406e-adb3-83609348bee7"
SciMLBase = "0bca4576-84f4-4d90-8ffe-ffa030f20462"

[compat]
# `ForwardDiff` and `SciMLBase` are dependencies of the package, but the example
# pages `using` them directly, so they must be declared here too. Without that
# they resolved only through whatever the machine happened to carry in its
# global environment — which passes locally and fails on a runner, where that
# environment is empty. Keep these bounds in step with the root Project.toml.
Documenter = "1"
ForwardDiff = "1"
SciMLBase = "2, 3"
julia = "1"

[sources]
OptimaSolver = {path = ".."}
