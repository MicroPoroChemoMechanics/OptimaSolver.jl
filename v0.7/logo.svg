  <!-- chemin central : iteres successifs descendant vers l'optimum -->
  <circle cx="195" cy="270" r="30" fill="#CB3C33"/>
  <circle cx="255" cy="384" r="24" fill="#9558B2"/>
  <!-- optimum atteint -->
  <circle cx="325" cy="430" r="38" fill="#389826"/>
  <circle cx="325" cy="430" r="15" fill="#FFFFFF"/>
