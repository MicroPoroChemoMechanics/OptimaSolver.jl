<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <title>OptimaSolver.jl</title>
  <!-- axes -->
  <g stroke="#CCCCCC" stroke-width="16" stroke-linecap="round" fill="none">
    <line x1="112" y1="96" x2="112" y2="508"/>
    <line x1="112" y1="508" x2="524" y2="508"/>
  </g>
  <!-- energie de Gibbs : parabole exacte (Bezier quadratique), minimum en (325,430) -->
